spring.application.name=backend
spring.jpa.hibernate.ddl-auto=validate

# Docker Compose Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# AI Service
ai.service.url=${AI_SERVICE_URL}

# JWT RSA keys
jwt.private-key-path=classpath:certs/private.pem
jwt.public-key-path=classpath:certs/public.pem

# JWT token expiration in seconds
access.token.expiration.time=3600
# Refresh token expiration in seconds (30 days)
refresh.token.expiration.time=2592000

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=backend-consumer
spring.kafka.consumer.auto-offset-reset=earliest

# Mail (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_EMAIL_USERNAME}
spring.mail.password=${SPRING_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
email.send.enabled=true

# App base URL used in verification emails
app.base-url=${APP_BASE_URL}
